*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0;font-weight:700}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:18px 0 8px;color:var(--sub);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--main)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.chip b{font-size:18px;margin-left:6px}
.chip.on{border-color:var(--main);background:var(--main-soft)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 24px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px 16px}header{padding:14px 16px}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.notice{border-left:4px solid var(--main);margin-bottom:12px}
.list button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.list button.on{border-color:var(--main);box-shadow:0 0 0 2px var(--main-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}
.list .nm{flex:1;min-width:0}.list .nm small{display:block;color:var(--sub);font-size:12px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid}
.tag.ok{color:var(--green);border-color:var(--green);background:var(--main-soft)}
.tag.fix{color:var(--yellow);border-color:var(--yellow);background:#fdf6e7}
.tag.rev{color:var(--red);border-color:var(--red);background:#fbeceb}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:12.5px}
td.l{text-align:left}
.bad{color:var(--red);font-weight:600}.na{color:var(--sub)}
.scroll{overflow-x:auto}
.trace li{margin:3px 0}
.pg{display:inline-block;background:var(--main-soft);color:var(--main);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600}
.pg.x{background:#fbeceb;color:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--main);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:14px}
input[type=date],input[type=email]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:13px;margin:0;font-family:inherit}
details{margin-top:10px}summary{cursor:pointer;color:var(--sub);font-size:13.5px}
.foot{color:var(--sub);font-size:12.5px;padding:0 24px 28px}
.impact{background:#fdf6e7;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px}

</head>

    return okEq && okYr
      ? `<li>${pg(k.page)} ${esc(k.equipment_name)} 공급가액 ${n(k.supply_amount)}원 (집행 ${esc(k.execution_date)}) → 포함</li>`
      : `<li>${pg(k.page,1)} ${esc(k.equipment_name)} ${n(k.supply_amount)}원 → 제외 (${!okEq?'대상 설비 아님':'2027년 집행 아님'})</li>`;
  }).join('');
  const other = c.pages.filter(p=>p.label==='non_target').map(p=>`<li>${pg(p.page,1)} 산정 대상이 아닌 문서 → 계산에서 제외</li>`).join('');
  const v = c.verdict;
  return `<h3>전력 사용량 → ${n(v.electricity_mwh)} MWh</h3><ul class="trace">${el}${miss}</ul>
    <h3>Scope 2 = 전력 × ${F.elec} → ${n(v.scope2_tco2e)} tCO2e</h3>
    <h3>Scope 1 → ${n(v.scope1_tco2e)} tCO2e</h3><ul class="trace">${fu}${miss}</ul>
    <h3>기후 관련 투자액 → ${n(v.capex_krw)}원</h3><ul class="trace">${co||'<li>계약 없음</li>'}${other}</ul>
    <h3>본사 산정표</h3><ul class="trace"><li>${pg(c.legacy.page)} 작성일 ${esc(c.legacy.legacy_date)}, 적용 배출계수 연도 ${esc(c.legacy.legacy_factor_year)}, 사업장 ${esc(c.legacy.legacy_sites)}</li></ul>`;
}

function impact(c){
  const v=c.verdict, L=c.legacy, out=[];
  ITEMS.forEach(it => { if (v[it.st]==='불일치'){ const d=L[it.lg]-v[it.key]; out.push(`${it.name} ${n(Math.abs(d))} ${it.unit} ${d>0?'과대':'과소'}`); }});
  return out.length ? `<div class="impact">산정표대로 공시했다면: <b>${out.join(' / ')}</b> 공시</div>` : '';
}

function download(name, text, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
const due = () => $('#due') ? $('#due').value : '';
function mailText(c){
  const v=c.verdict;
  return `제목: [${v.entity_name}] 2027년 기후공시 증빙 재제출 요청 (기한 ${due()})\n\n안녕하세요, 본사 ESG 공시 담당입니다.\n\n${v.entity_name} 2027년 KSSB 2호 공시값을 증빙으로 다시 산정하는 과정에서 아래 증빙을 확인할 수 없어 해당 항목을 산정하지 못했습니다.\n\n${v.missing_items.map(m=>'- '+m).join('\n')}\n\n위 증빙의 원본을 ${due()}까지 다시 제출해 주시기 바랍니다.\n- 판독 불가: 숫자가 선명하게 보이는 원본 또는 재스캔본\n- 중복: 실제 거래가 1건인지 확인하고, 2건이면 각각의 승인번호가 적힌 세금계산서\n- 누락: 해당 사업장의 2027년 연간 사용량 증빙\n\n재제출 전까지 전력·Scope 1·Scope 2는 공시 보류 상태입니다.\n감사합니다.`;
}
function ics(c){
  const d=due().replaceAll('-',''), v=c.verdict;
  const nx=new Date(due()); nx.setDate(nx.getDate()+1); const e=nx.toISOString().slice(0,10).replaceAll('-','');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KBS//Disclosure Gate//KO','BEGIN:VEVENT',`UID:${c.set}-${d}@kbs-gate`,`DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,'')}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:[${v.entity_name}] 기후공시 증빙 재제출 기한`,`DESCRIPTION:${v.missing_items.join(' / ')}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function fixCsv(c){
  const v=c.verdict, L=c.legacy;
  return '﻿항목,산정표 값,고칠 값,단위,원인\n' + ITEMS.filter(it=>v[it.st]==='불일치').map(it=>`${it.name},${L[it.lg]},${v[it.key]},${it.unit},"${(v.reason.split(' / ').find(r=>r.includes(it.key))||'').replace(/.*원인 /,'')}"`).join('\n');
}
function xbrl(c){
  const v=c.verdict;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<!-- 태그 예시입니다. 국내 KSSB 공시의 분류체계와 요소 이름은 확정 전이라 임의 이름을 썼습니다. -->\n<disclosure entity="${esc(v.entity_name)}" period="${v.reporting_year}-01-01/${v.reporting_year}-12-31" standard="KSSB 2">\n` +
    ` <fact concept="ElectricityConsumption" unit="MWh">${v.electricity_mwh}</fact>\n <fact concept="Scope1GHGEmissions" unit="tCO2e">${v.scope1_tco2e}</fact>\n <fact concept="Scope2GHGEmissionsLocationBased" unit="tCO2e">${v.scope2_tco2e}</fact>\n <fact concept="ClimateRelatedCapitalDeployment" unit="KRW">${v.capex_krw}</fact>\n</disclosure>\n`;
}
function packageMd(c){
  const v=c.verdict;
  const rows=[...c.electricity.map(e=>`| ${e.page} | ${e.site_name} 전력 증빙 | ${e.doc_no} | ${e.electricity_value} ${e.electricity_unit} |`),...c.fuel.map(f=>`| ${f.page} | ${f.site_name} ${f.fuel_type} 증빙 | ${f.doc_no} | ${f.fuel_value} ${f.fuel_unit} |`),...c.contract.map(k=>`| ${k.page} | ${k.equipment_name} 계약 | ${k.contract_no} | 공급가액 ${k.supply_amount}원 |`)].join('\n');
  return `${c.draft}\n\n## 증빙 추적표\n\n파일: ${c.file}\n\n| 쪽 | 문서 | 문서번호 | 값 |\n|---|---|---|---|\n${rows}\n\n## 검증 기록\n\n- 워크플로우 설정: #${DATA.config}\n- 실행 시각: ${c.runAt}\n- 증빙 검증 신호: ${SIG[c.signal]}\n- 판정: ${v.decision}\n- 대조 대상: 본사 취합 산정표(${c.legacy.page}쪽, 작성일 ${c.legacy.legacy_date})\n- 판정 기준: 오차 0.5% 이내 일치, capex는 정확히 일치\n`;
}

function action(c){
  const v=c.verdict;
  if (v.decision==='공시 가능') return `<div class="card"><h2>공시 패키지</h2>
    <div>네 항목이 모두 본사 산정표와 일치합니다. KSSB 2호 지표표, 증빙 추적표, 검증 기록을 한 묶음으로 내려받아 보고서 작성과 제3자 검증에 넘길 수 있습니다.</div>
    <div class="btns"><button class="btn" data-a="pkg">공시 패키지 내려받기 (.md)</button><button class="btn ghost" data-a="json">판정 JSON</button><button class="btn ghost" data-a="xbrl">기계 판독용 태그 예시 (.xml)</button></div>
    <details><summary>KSSB 2호 지표표 초안 보기</summary><pre>${esc(c.draft)}</pre></details></div>`;
  if (v.decision==='수정 필요') return `<div class="card"><h2>산정표 수정안</h2>
    <div class="scroll"><table><tr><th>항목</th><th>산정표 값</th><th>고칠 값</th><th>단위</th></tr>${ITEMS.filter(it=>v[it.st]==='불일치').map(it=>`<tr><td>${it.name}</td><td class="bad">${n(c.legacy[it.lg])}</td><td><b>${n(v[it.key])}</b></td><td>${it.unit}</td></tr>`).join('')}</table></div>
    ${impact(c)}
    <div class="btns"><button class="btn" data-a="csv">수정안 내려받기 (.csv, 엑셀용)</button></div>
    <div style="color:var(--sub);font-size:13.5px;margin-top:8px">산정표를 고친 뒤 다시 실행해 네 항목이 모두 일치하면 공시 패키지가 열립니다.</div></div>`;
  return `<div class="card"><h2>증빙 재제출 요청</h2>
    <div>확인이 필요한 증빙: <b>${v.missing_items.map(esc).join(', ')}</b></div>
    <div style="margin:10px 0;display:flex;gap:14px;flex-wrap:wrap">
      <label>재제출 기한 <input type="date" id="due"></label>
      <label>받는 사람 <input type="email" id="to" placeholder="공장 담당자 메일(선택)"></label></div>
    <textarea id="mail"></textarea>
    <div class="btns"><button class="btn" data-a="gmail">Gmail로 보내기</button><button class="btn" data-a="gcal">Google 캘린더에 기한 등록</button><button class="btn ghost" data-a="outlook">Outlook으로 보내기</button><button class="btn ghost" data-a="mailto">기본 메일 앱</button><button class="btn ghost" data-a="ics">캘린더 파일 (.ics)</button><button class="btn ghost" data-a="copy">본문 복사</button></div></div>`;
}

function render(){
  const cs = DATA.cases, cnt = d => cs.filter(c=>c.verdict.decision===d).length, ok = cnt('공시 가능');
  $('#cfg').textContent = DATA.config;
  $('#barfill').style.width = (ok/cs.length*100)+'%';
  $('#barlabel').textContent = `공시 준비 완료 ${ok} / ${cs.length} 법인`;
  $('#chips').innerHTML = [[null,'전체',cs.length],...Object.keys(DEC).map(d=>[d,d,cnt(d)])].map(([k,l,c])=>`<button class="chip${filter===k?' on':''}" data-f="${k??''}">${l}<b>${c}</b></button>`).join('');
  $('#notice').innerHTML = `<b>${cs.length}개 법인 검증 완료</b><br>공시 가능 ${ok} · 수정 필요 ${cnt('수정 필요')} · 검토 필요 ${cnt('검토 필요')}<br><span style="color:var(--sub);font-size:13.5px">조치가 필요한 ${cs.length-ok}건만 확인하면 됩니다.</span>`;
  $('#list').innerHTML = cs.map((c,i)=>({c,i})).filter(x=>!filter||x.c.verdict.decision===filter).map(({c,i})=>`<button class="${i===cur?'on':''}" data-i="${i}"><span class="dot ${c.signal}" title="증빙 검증 ${SIG[c.signal]}"></span><span class="nm">${esc(c.verdict.entity_name)}<small>${c.set} · 문서 ${c.pages.length}쪽</small></span><span class="tag ${DEC[c.verdict.decision]}">${c.verdict.decision}</span></button>`).join('');
  const c = cs[cur], v = c.verdict;
  $('#detail').innerHTML = `<div class="card" style="margin-bottom:12px">
    <h2>${esc(v.entity_name)} <span class="tag ${DEC[v.decision]}">${v.decision}</span> <span style="font-weight:400;color:var(--sub);font-size:13px">증빙 검증 <span class="dot ${c.signal}" style="display:inline-block"></span> ${SIG[c.signal]}</span></h2>
    <div class="scroll"><table><tr><th>지표</th><th>증빙으로 다시 산정한 값</th><th>본사 산정표</th><th>단위</th><th>상태</th></tr>
    ${ITEMS.map(it=>`<tr><td>${it.name}</td><td>${n(v[it.key])}</td><td>${n(c.legacy[it.lg])}</td><td>${it.unit}</td><td class="${v[it.st]==='일치'?'':'bad'}">${v[it.st]}</td></tr>`).join('')}</table></div>
    <div style="margin-top:10px"><b>판정 근거</b> ${esc(v.reason).replaceAll(' / ','<br>')}</div>
    ${c.failedChecks.length?`<div style="margin-top:6px;color:var(--sub);font-size:13.5px">증빙 검증에서 걸린 규칙: ${c.failedChecks.map(f=>`${f.name}(${f.severity==='error'?'필수':'선택'})`).join(', ')}</div>`:''}
  </div>
  ${action(c)}
  <div class="card" style="margin-top:12px"><h2>증빙 추적 <span style="font-weight:400;color:var(--sub);font-size:13px">${esc(c.file)}</span></h2>${trace(c)}
    <details><summary>워크플로우 산정 기록 보기</summary><pre>${esc(c.calcNotes)}</pre></details></div>`;
  if ($('#due')){ const d=new Date(); d.setDate(d.getDate()+7); $('#due').value=d.toISOString().slice(0,10); $('#mail').value=mailText(c); $('#due').onchange=()=>{$('#mail').value=mailText(c)}; }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const c = DATA.cases[cur], name = c.verdict.entity_name;
  if (b.dataset.f!==undefined){ filter=b.dataset.f||null; const vis=DATA.cases.findIndex(x=>!filter||x.verdict.decision===filter); if(vis>=0) cur=vis; return render(); }
  if (b.dataset.i!==undefined){ cur=+b.dataset.i; return render(); }
  switch(b.dataset.a){
    case 'pkg': return download(`${name}_공시패키지.md`, packageMd(c));
    case 'json': return download(`${name}_판정.json`, JSON.stringify(c.verdict,null,1), 'application/json');
    case 'xbrl': return download(`${name}_태그예시.xml`, xbrl(c), 'application/xml');
    case 'csv': return download(`${name}_산정표_수정안.csv`, fixCsv(c), 'text/csv;charset=utf-8');
    case 'ics': return download(`${name}_재제출기한.ics`, ics(c), 'text/calendar');
    case 'copy': return navigator.clipboard.writeText($('#mail').value).then(()=>{b.textContent='복사됨'});
    case 'mailto': case 'gmail': case 'outlook': {
      // 로그인된 계정의 작성 창을 제목·본문·받는 사람이 채워진 채로 연다. 발송 버튼은 사람이 누른다.
      const t=$('#mail').value, E=encodeURIComponent, s=E(t.split('\n')[0].replace('제목: ','')), body=E(t.split('\n').slice(2).join('\n')), to=E($('#to').value.trim());
      const url={mailto:`mailto:${to}?subject=${s}&body=${body}`, gmail:`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${s}&body=${body}`, outlook:`https://outlook.office.com/mail/deeplink/compose?to=${to}&subject=${s}&body=${body}`}[b.dataset.a];
      return b.dataset.a==='mailto' ? (location.href=url) : window.open(url,'_blank','noopener');
    }
    case 'gcal': {
      const E=encodeURIComponent, d=due().replaceAll('-',''), nx=new Date(due()); nx.setDate(nx.getDate()+1);
      const to=$('#to').value.trim();
      return window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${E(`[${name}] 기후공시 증빙 재제출 기한`)}&dates=${d}/${nx.toISOString().slice(0,10).replaceAll('-','')}&details=${E(c.verdict.missing_items.join('\n'))}${to?`&add=${E(to)}`:''}`,'_blank','noopener');
    }
  }
});
render();
</script>
</body>
</html>
